# Local infrastructure for Mersal. Host ports use the 5xxxx range so they
# don't collide with other projects' Postgres/Redis on the default ports.
name: mersal

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mersal
      POSTGRES_PASSWORD: mersal
      POSTGRES_DB: mersal
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mersal -d mersal']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:51025:1025'
      - '127.0.0.1:58025:8025'

volumes:
  pgdata:
